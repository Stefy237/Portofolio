# Propose chaque semaine des pull requests de mise à jour des dépendances et des actions GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      fontsource:
        patterns: ['@fontsource/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    ignore:
      # La 5.x renomme des ressources (cloudflare_record → cloudflare_dns_record) : migration manuelle.
      - dependency-name: cloudflare/cloudflare
        update-types: ['version-update:semver-major']
